name: Sync FineTune Nightly

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-finetune-nightly.yml'
      - '.github/scripts/sync-finetune-nightly.py'

permissions:
  contents: write

concurrency:
  group: sync-finetune-nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      # setup-homebrew recreates the tap checkout, so run it first.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test sync logic
        run: python3 -m unittest discover -s tests -v

      - name: Download and validate latest FineTune Nightly
        id: prepare
        run: python3 .github/scripts/sync-finetune-nightly.py

      - name: Validate generated cask from this checkout
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/kkkkeybird/homebrew-tap"
          test "$(cd "$tap_dir" && pwd -P)" = "$(pwd -P)"
          brew style --fix --cask KKKKeybird/tap/finetune-nightly
          brew audit --cask KKKKeybird/tap/finetune-nightly

      - name: Publish immutable installer and provenance
        if: steps.prepare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/finetune-nightly-release"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('provenance.json').read_text())
          Path('notes.md').write_text(
              f"FineTune community nightly mirrored from {p['upstream']}.\n\n"
              f"Source release: {p['release_url']}\n\n"
              f"Version: {p['version']}\n\n"
              f"Architectures: {', '.join(p['architectures'])}; "
              f"macOS >= {p['minimum_macos']}.\n\n"
              "This build is ad-hoc signed and not notarized. Install and update it "
              "through Homebrew: brew install --cask finetune-nightly.\n"
          )
          PY
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft > release.json; then
            if [ "$(python3 -c 'import json; print(json.load(open("release.json"))["isDraft"])')" = True ]; then
              gh release upload "$RELEASE_TAG" FineTune-Nightly.zip SHA256SUMS provenance.json \
                --clobber -R "$GITHUB_REPOSITORY"
            else
              mkdir existing
              gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --dir existing \
                --pattern FineTune-Nightly.zip --pattern SHA256SUMS --pattern provenance.json
              cmp FineTune-Nightly.zip existing/FineTune-Nightly.zip
              cmp SHA256SUMS existing/SHA256SUMS
              cmp provenance.json existing/provenance.json
            fi
          else
            gh release create "$RELEASE_TAG" FineTune-Nightly.zip SHA256SUMS provenance.json \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "FineTune Nightly $RELEASE_TAG" --notes-file notes.md
          fi
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest=false

      - name: Test Homebrew download and installation
        if: steps.prepare.outputs.changed == 'true'
        run: brew install --cask KKKKeybird/tap/finetune-nightly

      - name: Commit cask after successful release publication
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/finetune-nightly.rb .github/finetune-nightly.json
          if git diff --cached --quiet; then
            echo "Cask already matches the published immutable release."
            exit 0
          fi
          git commit -m 'Update finetune-nightly cask'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
