name: Update convt-free cask
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/convt-free.yml', 'lib/update-convt-free.py']
permissions:
  contents: write
concurrency:
  group: convt-free-cask
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published ZIP against SHA256SUMS and generate cask
        run: python3 lib/update-convt-free.py
      - name: Validate Ruby and commit only changed cask
        run: |
          ruby -c Casks/convt-free.rb
          if git diff --quiet -- Casks/convt-free.rb && ! git ls-files --others --exclude-standard Casks/convt-free.rb | grep -q .; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/convt-free.rb
          git commit -m 'chore: update convt-free from verified release'
          git push
  test:
    needs: update
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Install published cask through Homebrew
        run: |
          test "$(uname -m)" = arm64
          brew tap KKKKeybird/tap
          brew install --cask KKKKeybird/tap/convt-free
          test -d /Applications/convt.app/Contents/PlugIns/FinderSync.appex
          test -f "$HOME/Library/Services/convt-free.workflow/Contents/document.wflow"
          codesign --verify --deep --strict /Applications/convt.app
      - name: Run the installed CLI and check upgrade handling
        run: |
          work=$(mktemp -d)
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="12"><rect width="16" height="12" fill="red"/></svg>' > "$work/sample.svg"
          convt-free "$work/sample.svg" --to png --out-dir "$work/out"
          file "$work/out/sample.png" | grep 'PNG image data, 16 x 12'
          convt-free license status
          brew upgrade --cask convt-free
          # This checks an already-current install. A real upgrade across two
          # published versions remains a separate acceptance check.
      - name: Uninstall and verify managed paths are removed
        if: always()
        run: |
          brew uninstall --cask convt-free
          test ! -e /Applications/convt.app
          test ! -e /opt/homebrew/bin/convt-free
          test ! -e "$HOME/Library/Services/convt-free.workflow"
