name: Monitor convt-free builds
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/convt-free-monitor.yml']
permissions:
  actions: read
  issues: write
concurrency:
  group: convt-free-failure-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report failed convt build or source sync in this existing tap
        run: |
          set -euo pipefail
          gh api 'repos/KKKKeybird/convt/actions/runs?per_page=100' --jq '[.workflow_runs[] | select(.name == "Sync and build ordinary source" and .status == "completed")][0]' > "$RUNNER_TEMP/run.json"
          conclusion=$(jq -r '.conclusion // "none"' "$RUNNER_TEMP/run.json")
          case "$conclusion" in failure|timed_out|action_required|startup_failure) ;; *) exit 0 ;; esac
          run_id=$(jq -r .id "$RUNNER_TEMP/run.json")
          url=$(jq -r .html_url "$RUNNER_TEMP/run.json")
          title="convt-free automation failed (run $run_id)"
          if [ "$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number --jq length)" = 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The convt source mirror/build/release pipeline failed ($conclusion). Its previous published version remains available. Inspect $url . This report is filed in the existing tap because GitHub forks disable Issues by default."
          fi
