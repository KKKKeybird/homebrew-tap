name: Sync rounded inshellisense formula

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rounded-inshellisense-formula
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check latest rounded release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api repos/KKKKeybird/inshellisense/releases/latest)"
          tag="$(jq -r .tag_name <<<"${release}")"
          source_sha="$(jq -r .target_commitish <<<"${release}")"
          version="$(gh api "repos/KKKKeybird/inshellisense/contents/package.json?ref=${source_sha}" --jq .content | base64 --decode | jq -r .version)"
          current_tag="$(sed -n 's/^# release_tag: //p' Formula/inshellisense-rounded.rb 2>/dev/null || true)"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == "${current_tag}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release packages
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo KKKKeybird/inshellisense \
            --pattern "microsoft-inshellisense-*.tgz" \
            --dir /tmp/inshellisense-rounded-packages

      - name: Update formula
        if: steps.release.outputs.changed == 'true'
        env:
          PACKAGE_DIR: /tmp/inshellisense-rounded-packages
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node .github/scripts/update-inshellisense-rounded.mjs

      - name: Commit formula
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/inshellisense-rounded.rb
          git commit -m "Update rounded inshellisense formula"
          git pull --rebase
          git push
