name: Build rounded inshellisense

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rounded-inshellisense
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.source.outputs.changed }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check rounded branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(gh api repos/KKKKeybird/inshellisense/git/ref/heads/agent/rounded-corners --jq .object.sha)"
          version="$(gh api "repos/KKKKeybird/inshellisense/contents/package.json?ref=${source_sha}" --jq .content | base64 --decode | jq -r .version)"
          current_sha="$(sed -n 's/^# source_commit: //p' Formula/inshellisense-rounded.rb 2>/dev/null || true)"

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${source_sha}" == "${current_sha}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: inshellisense-darwin-arm64
          - os: macos-15-intel
            artifact_name: inshellisense-darwin-x64
          - os: ubuntu-latest
            artifact_name: inshellisense-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: inshellisense-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out rounded source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: KKKKeybird/inshellisense
          ref: ${{ needs.check.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run package

      - name: Verify package
        shell: bash
        run: tar -tzf pkg/*.tgz >/dev/null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: pkg/*.tgz
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: /tmp/inshellisense-rounded-packages
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="inshellisense-rounded-${VERSION}-${SOURCE_SHA:0:7}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "inshellisense ${VERSION} rounded (${SOURCE_SHA:0:7})" \
              --notes "Automated build of KKKKeybird/inshellisense@${SOURCE_SHA}."
          fi
          gh release upload "${tag}" /tmp/inshellisense-rounded-packages/*.tgz --clobber
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Update formula
        env:
          PACKAGE_DIR: /tmp/inshellisense-rounded-packages
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: node .github/scripts/update-inshellisense-rounded.mjs

      - name: Commit formula
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/inshellisense-rounded.rb
          git commit -m "Update rounded inshellisense formula"
          git push
