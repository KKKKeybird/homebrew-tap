name: Sync cask releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask-releases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sync upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Sync attempt ${attempt}/${max_attempts}"
            if .github/scripts/sync-casks.sh; then
              exit 0
            fi

            if [[ "${attempt}" -eq "${max_attempts}" ]]; then
              echo "::error::Sync failed after ${max_attempts} attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Sync attempt ${attempt} failed; retrying in ${delay}s."
            sleep "${delay}"
          done

      - name: Commit updates
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All casks are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "Update cask releases"
          git push
