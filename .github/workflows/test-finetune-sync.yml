name: Test FineTune sync

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-finetune.py'
      - '.github/workflows/*finetune*.yml'
      - 'tests/test_finetune_sync.py'
  pull_request:
    paths:
      - '.github/scripts/sync-finetune.py'
      - '.github/workflows/*finetune*.yml'
      - 'tests/test_finetune_sync.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests -v
