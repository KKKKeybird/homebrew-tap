name: Test tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Validate cask
        run: |
          brew style --cask Casks/moonlight-vplus.rb
          brew audit --cask --online Casks/moonlight-vplus.rb
